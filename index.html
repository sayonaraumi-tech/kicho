<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>記帳システム</title>
<meta name="description" content="内装工事会社 内部記帳システム">
<meta name="theme-color" content="#1F4E78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F4E78'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='serif' font-weight='bold'%3E帳%3C/text%3E%3C/svg%3E">

<style>
body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: #f5f5f4; }
#loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 12px; color: #57534e; padding: 20px; text-align: center; }
#loading .spinner { width: 40px; height: 40px; border: 3px solid #e7e5e4; border-top-color: #1F4E78; border-radius: 50%; animation: spin 0.8s linear infinite; }
#loading .status { font-size: 12px; color: #78716c; margin-top: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
#error-box { display: none; padding: 20px; max-width: 600px; margin: 40px auto; background: #fef2f2; border: 2px solid #dc2626; border-radius: 8px; }
#error-box h2 { color: #991b1b; margin-top: 0; }
#error-box pre { background: #1f2937; color: #fca5a5; padding: 12px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
#error-box button { background: #1F4E78; color: white; border: 0; padding: 10px 16px; border-radius: 4px; cursor: pointer; margin: 4px; font-size: 14px; }
.online-only { display: none; color: #6b7280; font-size: 13px; margin-top: 16px; max-width: 400px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="root">
  <div id="loading">
    <div class="spinner"></div>
    <div>読み込み中...</div>
    <div class="status" id="load-status">ライブラリを準備しています...</div>
    <div class="online-only" id="offline-hint">
      📡 ライブラリの読み込みに時間がかかっています。<br>
      <strong>ファイルアプリのプレビューでは動作しません。</strong><br>
      GitHub Pages にデプロイしてブラウザで開いてください。
    </div>
  </div>
</div>
<div id="error-box">
  <h2>⚠️ エラー</h2>
  <p id="error-context"></p>
  <pre id="error-message"></pre>
  <button onclick="location.reload()">再読み込み</button>
  <button onclick="if(confirm('保存されたデータを削除しますか?')){localStorage.clear();location.reload();}">データをリセット</button>
</div>

<script>
// グローバルエラーキャッチ
window.addEventListener('error', function(e) {
  if (e.message && e.message.indexOf('ResizeObserver') !== -1) return; // 無視
  showError('JavaScript エラー', (e.error && e.error.stack) || e.message || String(e));
});
window.addEventListener('unhandledrejection', function(e) {
  showError('Promise エラー', (e.reason && e.reason.stack) || String(e.reason));
});
function showError(title, msg) {
  var box = document.getElementById('error-box');
  var loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
  if (box) {
    box.style.display = 'block';
    var ctx = document.getElementById('error-context');
    if (ctx) ctx.textContent = title;
    document.getElementById('error-message').textContent = msg;
  }
}
function setStatus(msg) {
  var el = document.getElementById('load-status');
  if (el) el.textContent = msg;
}

// オンライン状態確認
if (!navigator.onLine) {
  setTimeout(function() {
    var hint = document.getElementById('offline-hint');
    if (hint) hint.style.display = 'block';
  }, 1500);
}

// ストレージ + Gist 同期
window.storage = {
  get: function(key) {
    return new Promise(function(resolve) {
      try {
        var v = localStorage.getItem('accounting_' + key);
        resolve(v ? { key: key, value: v } : null);
      } catch(e) { resolve(null); }
    });
  },
  set: function(key, value) {
    return new Promise(function(resolve) {
      try {
        localStorage.setItem('accounting_' + key, value);
        resolve({ key: key, value: value });
      } catch(e) { resolve(null); }
    });
  }
};

// Gist 同期 API
window.gistSync = {
  // GitHub Personal Access Token と Gist ID を localStorage に保存
  getConfig: function() {
    return {
      token: localStorage.getItem('gist_token') || '',
      gistId: localStorage.getItem('gist_id') || '',
    };
  },
  saveConfig: function(token, gistId) {
    localStorage.setItem('gist_token', token);
    localStorage.setItem('gist_id', gistId);
  },
  // データをアップロード
  upload: async function(data) {
    var cfg = this.getConfig();
    if (!cfg.token || !cfg.gistId) throw new Error('Gist 設定が未完了です');
    var res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
      method: 'PATCH',
      headers: {
        'Authorization': 'token ' + cfg.token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        files: {
          'accounting_data.json': {
            content: JSON.stringify(data, null, 2)
          }
        }
      })
    });
    if (!res.ok) {
      var err = await res.text();
      throw new Error('Gist アップロード失敗: ' + res.status + ' ' + err);
    }
    return await res.json();
  },
  // データをダウンロード
  download: async function() {
    var cfg = this.getConfig();
    if (!cfg.token || !cfg.gistId) throw new Error('Gist 設定が未完了です');
    var res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
      headers: {
        'Authorization': 'token ' + cfg.token,
        'Accept': 'application/vnd.github.v3+json',
      }
    });
    if (!res.ok) throw new Error('Gist ダウンロード失敗: ' + res.status);
    var gist = await res.json();
    var file = gist.files['accounting_data.json'];
    if (!file) throw new Error('accounting_data.json が見つかりません');
    return JSON.parse(file.content);
  }
};
</script>

<script>
function waitForLibs(callback) {
  var tries = 0;
  var maxTries = 200; // 20 秒
  function check() {
    tries++;
    var missing = [];
    if (!window.React) missing.push('React');
    if (!window.ReactDOM) missing.push('ReactDOM');
    if (!window.Recharts) missing.push('Recharts');
    if (!window.XLSX) missing.push('XLSX');
    if (!window.Papa) missing.push('PapaParse');
    if (missing.length === 0) {
      setStatus('起動中...');
      callback();
      return;
    }
    setStatus('読み込み中: 残り ' + missing.join(', '));
    // 5秒以上待ってるならヒント表示
    if (tries === 50) {
      var hint = document.getElementById('offline-hint');
      if (hint) hint.style.display = 'block';
    }
    if (tries > maxTries) {
      showError('ライブラリ読み込み失敗',
        '読み込めなかったライブラリ: ' + missing.join(', ') + '\n\n' +
        '【考えられる原因】\n' +
        '1. インターネット接続が不安定\n' +
        '2. ファイルアプリのプレビューで開いている (Safari/Chromeブラウザで開いてください)\n' +
        '3. CDN がブロックされている\n\n' +
        '【解決方法】\n' +
        'GitHub Pages にデプロイして、ブラウザでアクセスしてください。');
      return;
    }
    setTimeout(check, 100);
  }
  check();
}
